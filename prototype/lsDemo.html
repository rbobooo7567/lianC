<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>链存 · 连锁补货原型</title>
<style>
  :root {
    --bg: #f4f4f2;
    --surface: #fff;
    --ink: #1c1917;
    --muted: #57534e;
    --line: #e7e5e4;
    --sidebar: #1c1917;
    --accent: #0f766e;
    --bad: #9f1239;
    --bad-bg: #fff1f2;
    --warn: #92400e;
    --warn-bg: #fffbeb;
    --over: #1e3a8a;
    --over-bg: #eff6ff;
    --ok: #047857;
    --ok-bg: #ecfdf5;
    --sel: #f0fdfa;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    color: var(--ink);
    background: var(--bg);
    font-size: 14px;
    line-height: 1.45;
  }
  button, input, select { font: inherit; color: inherit; }
  button { cursor: pointer; }
  button:focus-visible, input:focus-visible, select:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 1px;
  }
  h1 { font-size: 22px; line-height: 1.25; margin: 0; font-weight: 650; }
  h2 { font-size: 18px; margin: 22px 0 8px; font-weight: 650; }
  h3 { font-size: 15px; margin: 0 0 6px; font-weight: 650; }
  p { margin: 0; }
  .shell { display: flex; min-height: 100vh; min-width: 1180px; }
  .side {
    width: 212px;
    flex: none;
    background: var(--sidebar);
    color: #e7e5e4;
    display: flex;
    flex-direction: column;
    padding: 16px 12px 14px;
  }
  .brand strong { display: block; color: #fff; font-size: 18px; letter-spacing: 0.06em; }
  .brand span { display: block; margin-top: 2px; color: #a8a29e; font-size: 12px; }
  .nav-label { margin: 16px 8px 4px; font-size: 11px; color: #78716c; }
  .side button.nav {
    width: 100%;
    text-align: left;
    border: 0;
    background: transparent;
    color: #d6d3d1;
    border-radius: 6px;
    padding: 8px 10px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .side button.nav.on { background: #292524; color: #fff; }
  .badge {
    min-width: 18px;
    height: 18px;
    padding: 0 5px;
    border-radius: 99px;
    background: var(--bad);
    color: #fff;
    font-size: 11px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }
  .side .foot { margin-top: auto; padding: 12px 8px 0; color: #78716c; font-size: 12px; }
  .workspace { flex: 1; min-width: 0; }
  .top {
    display: flex;
    justify-content: space-between;
    gap: 16px;
    align-items: flex-end;
    padding: 18px 22px 12px;
  }
  .sub { color: var(--muted); font-size: 13px; margin-top: 4px; }
  .page { padding: 0 22px 40px; }
  .actions { display: flex; gap: 8px; align-items: center; }
  .btn {
    height: 32px;
    padding: 0 12px;
    border-radius: 6px;
    border: 1px solid var(--line);
    background: var(--surface);
  }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn:disabled { opacity: 0.45; cursor: default; }
  .btn.small { height: 28px; padding: 0 8px; font-size: 12px; }
  .linkish {
    border: 0;
    background: none;
    color: var(--accent);
    padding: 0;
    text-align: left;
  }
  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
  .stat {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 12px 14px;
  }
  .stat b {
    display: block;
    font-size: 26px;
    font-weight: 650;
    letter-spacing: -0.03em;
    font-variant-numeric: tabular-nums;
  }
  .stat span { color: var(--muted); font-size: 12px; }
  .stat.hot b { color: var(--bad); }
  .note {
    margin-top: 12px;
    padding: 8px 12px;
    background: var(--warn-bg);
    border-left: 3px solid #d97706;
    font-size: 13px;
  }
  .cols { display: grid; grid-template-columns: 1.45fr 0.8fr; gap: 14px; margin-top: 14px; }
  .panel { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; }
  .pad { padding: 12px 14px; }
  .headrow {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 8px;
    border-bottom: 1px solid var(--line);
  }
  .headrow span, .muted { color: var(--muted); }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th {
    text-align: left;
    font-weight: 600;
    font-size: 12px;
    color: var(--muted);
    padding: 8px 10px;
    border-bottom: 1px solid var(--line);
    white-space: nowrap;
  }
  td { padding: 9px 10px; border-bottom: 1px solid var(--line); vertical-align: middle; }
  .num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  tr.sel td { background: var(--sel); }
  .rules { margin: 0; padding-left: 18px; }
  .rules li { margin: 6px 0; }
  .bar-row { display: flex; align-items: center; gap: 10px; margin: 8px 0; font-size: 13px; }
  .bar-name { width: 72px; flex: none; }
  .track { flex: 1; height: 8px; background: #e7e5e4; border-radius: 99px; overflow: hidden; }
  .fill { display: block; height: 100%; background: #a8a29e; }
  .fill.bad { background: var(--bad); }
  .fill.warn { background: #b45309; }
  .fill.over { background: var(--over); }
  .bar-val { width: 168px; flex: none; text-align: right; color: var(--muted); font-variant-numeric: tabular-nums; }
  .split { display: flex; gap: 14px; align-items: flex-start; }
  .grow { flex: 1; min-width: 0; }
  .filters { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
  .filters button.on { background: var(--ink); color: #fff; border-color: var(--ink); }
  .drawer {
    width: 332px;
    flex: none;
    position: sticky;
    top: 12px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 14px;
  }
  .drawer h3 { font-size: 16px; }
  .verdict { font-size: 14px; font-weight: 650; margin-bottom: 8px; }
  .calc { margin: 8px 0 0; padding-left: 18px; }
  .calc li { margin: 4px 0; }
  .drawer .row-actions { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 12px; align-items: center; }
  .qty {
    width: 88px;
    height: 32px;
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 0 8px;
    background: #fff;
  }
  .pill {
    display: inline-flex;
    align-items: center;
    height: 22px;
    padding: 0 8px;
    border-radius: 99px;
    font-size: 12px;
    background: #f5f5f4;
    color: #44403c;
    white-space: nowrap;
  }
  .pill.bad { background: var(--bad-bg); color: var(--bad); }
  .pill.warn { background: var(--warn-bg); color: var(--warn); }
  .pill.over { background: var(--over-bg); color: var(--over); }
  .pill.ok { background: var(--ok-bg); color: var(--ok); }
  .legend { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin: 0 0 10px; font-size: 12px; color: var(--muted); }
  .heat td, .heat th.num { text-align: center; }
  .heat td { padding: 0; }
  .heat button.cell {
    width: 100%;
    border: 0;
    background: transparent;
    padding: 10px 0;
    font-weight: 650;
    font-variant-numeric: tabular-nums;
  }
  .heat td.bad { background: var(--bad-bg); }
  .heat td.bad button { color: var(--bad); }
  .heat td.warn { background: var(--warn-bg); }
  .heat td.warn button { color: var(--warn); }
  .heat td.over { background: var(--over-bg); }
  .heat td.over button { color: var(--over); }
  .heat td.on { outline: 2px solid var(--accent); outline-offset: -2px; }
  .tabs { display: flex; gap: 6px; margin-bottom: 10px; }
  .tabs button.on { background: var(--ink); color: #fff; border-color: var(--ink); }
  .stage { display: flex; gap: 28px; align-items: flex-start; }
  .guide { width: 280px; }
  .guide ol { margin: 8px 0 0; padding-left: 18px; }
  .guide li { margin: 6px 0; }
  select.store-pick { width: 100%; height: 34px; border: 1px solid var(--line); border-radius: 6px; background: #fff; margin: 8px 0 12px; }
  .phone {
    width: 360px;
    height: 740px;
    border: 10px solid #1c1917;
    border-radius: 32px;
    background: #fafaf9;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .phone-bar {
    height: 42px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0 16px;
    font-size: 12px;
    color: #44403c;
    border-bottom: 1px solid var(--line);
    background: #fff;
  }
  .phone-scroll { flex: 1; overflow: auto; padding: 4px 16px 20px; }
  .task { padding: 12px 0; border-bottom: 1px solid var(--line); }
  .task-top { display: flex; justify-content: space-between; gap: 8px; align-items: center; }
  .task p { margin-top: 6px; color: var(--muted); font-size: 13px; }
  .task .row-actions { margin-top: 8px; }
  .flow { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 4px 0 8px; }
  .flow span { color: var(--muted); }
  .mod { margin-top: 8px; }
  .mask {
    position: fixed;
    inset: 0;
    background: rgba(28, 25, 23, 0.45);
    display: flex;
    justify-content: center;
    padding: 40px 16px;
    z-index: 20;
  }
  .sheet {
    width: min(920px, 100%);
    background: #fff;
    border-radius: 12px;
    max-height: calc(100vh - 80px);
    overflow: auto;
  }
  .toast {
    position: fixed;
    bottom: 18px;
    left: 50%;
    transform: translateX(-50%);
    background: #1c1917;
    color: #fff;
    padding: 10px 14px;
    border-radius: 8px;
    font-size: 13px;
    z-index: 30;
  }
</style>

  ["二期", "规则", "新品观察期", "总部运营", "", "新品前 14 天不判滞销。"],
  ["二期", "规则", "总部锁库存", "总部运营", "", "活动预留库存不参与分配。"]
];

const params = new URLSearchParams(location.search);
const allowed = new Set(["home", "replenish", "transfer", "matrix", "alerts", "store", "params", "list"]);
const state = {
  screen: allowed.has(params.get("screen")) ? params.get("screen") : "home",
  filter: "todo",
  selected: null,
  cell: null,
  alertTab: ["stockout", "over", "anom", "expiry", "count"].includes(params.get("tab")) ? params.get("tab") : "stockout",
  managerStore: "dxc",
  modal: false,
  toast: "",
  decisions: {},
  config: JSON.parse(JSON.stringify(DEFAULT_CONFIG))
};

function esc(s) {
  return String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
}
function n1(n) {
  return Number(n).toLocaleString("zh-CN", { maximumFractionDigits: 1 });
}
function n0(n) {
  return Math.round(Number(n)).toLocaleString("zh-CN");
}
function money(n) {
  return "¥" + Number(n).toLocaleString("zh-CN", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}
function heat(dos) {
  if (dos < 2) return "bad";
  if (dos < 4) return "warn";
  if (dos >= 21) return "over";
  return "";
}
function sourceName(p) {
  if (p.source === "transfer") return "店间调拨";
  if (p.source === "dc") return "总仓配送";
  if (p.source === "supplier") return "供应商直送";
  return "在途已覆盖";
}
function statusMeta(p) {
  if (p.status === "confirmed") return ["已确认", "ok"];
  if (p.status === "hold") return ["已暂缓", ""];
  if (p.blocked) return ["总仓不足", "bad"];
  if (p.execQty === 0 && p.suggest === 0) return ["不必补", ""];
  if (p.execQty === 0) return ["未分配", "bad"];
  return ["待确认", "warn"];
}
function inFilter(p, f) {
  if (f === "transfer") return p.source === "transfer";
  if (f === "dc") return p.source === "dc";
  if (f === "supplier") return p.source === "supplier";
  return p.source !== "covered";
}

function build() {
  const plans = ROWS.map((raw) => {
    const sku = Object.assign({ id: raw.sku }, SKUS[raw.sku]);
    const cfg = state.config[sku.cat];
    const sellable = raw.onHand - raw.reserved;
    const cover = sellable + raw.transit;
    const targetDays = cfg.lead + cfg.safety;
    const targetQty = targetDays * raw.daily;
    const gap = Math.max(0, targetQty - cover);
    const suggest = gap === 0 ? 0 : Math.ceil((gap - 1e-9) / sku.case) * sku.case;
    const d = state.decisions[raw.id];
    const stored = d && d.qty != null ? Number(d.qty) : suggest;
    const request = d && d.status === "hold" ? 0 : stored;
    return {
      ...raw,
      sku,
      cfg,
      sellable,
      cover,
      targetDays,
      targetQty,
      gap,
      suggest,
      dos: raw.daily ? sellable / raw.daily : 0,
      dosAll: raw.daily ? cover / raw.daily : 0,
      stored,
      request,
      status: raw.source === "covered" ? "covered" : (d ? d.status : "pending"),
      execQty: 0,
      stepMax: 0,
      blocked: false
    };
  });

  const dcGroups = {};
  plans.forEach((p) => {
    if (p.source === "dc") (dcGroups[p.sku.id] || (dcGroups[p.sku.id] = [])).push(p);
  });
  Object.keys(dcGroups).forEach((id) => {
    const list = dcGroups[id].slice().sort((a, b) => a.dos - b.dos || a.id.localeCompare(b.id));
    let left = list[0].dcOnHand;
    list.forEach((p) => {
      const caseSize = p.sku.case;
      p.stepMax = Math.floor(left / caseSize) * caseSize;
      const give = Math.min(Math.max(0, p.request), p.stepMax);
      p.execQty = Math.floor(give / caseSize) * caseSize;
      left -= p.execQty;
      p.blocked = p.suggest > 0 && p.execQty === 0 && p.status !== "hold";
    });
  });

  const pool = {};
  plans.forEach((p) => {
    if (p.source !== "transfer") return;
    const key = p.from + "|" + p.sku.id;
    const base = FROM[key];
    if (pool[key] == null) pool[key] = base.onHand;
    const caseSize = p.sku.case;
    const maxGive = Math.max(0, Math.floor((pool[key] - 14 * base.daily) / caseSize) * caseSize);
    p.stepMax = maxGive;
    const give = Math.min(Math.max(0, p.request), maxGive);
    p.execQty = Math.floor(give / caseSize) * caseSize;
    p.fromBefore = pool[key];
    pool[key] -= p.execQty;
    p.fromAfter = pool[key];
    p.fromDaily = base.daily;
    p.fromDosBefore = p.fromBefore / base.daily;
    p.fromDosAfter = p.fromAfter / base.daily;
  });

  plans.forEach((p) => {
    if (p.source === "supplier") {
      p.stepMax = p.suggest;
      const give = Math.min(Math.max(0, p.request), p.stepMax);
      p.execQty = Math.floor(give / p.sku.case) * p.sku.case;
    }
    if (p.source === "covered") {
      p.stepMax = 0;
      p.execQty = 0;
    }
  });
  return plans;
}

function shownQty(p) {
  if (p.status === "hold") return p.stored;
  return p.execQty;
}

function verdict(p) {
  const u = p.sku.unit;
  if (p.source === "covered") {
    return "在途已经盖住目标库存，今天不补。";
  }
  if (p.status === "hold") {
    return "这条已暂缓，不占用可调数量，也不进配货草稿。";
  }
  if (p.blocked) {
    return "总仓现货已经分给可售更短的门店，本店今天分配到 0。";
  }
  if (p.source === "transfer") {
    return "从" + STORES[p.from].name + "调入 " + n0(p.execQty) + " " + u + "。调出后对方还有 " + n1(p.fromDosAfter) + " 天。";
  }
  if (p.source === "dc") {
    return "总仓配送 " + n0(p.execQty) + " " + u + "。";
  }
  return "供应商直送 " + n0(p.execQty) + " " + u + "。交期 " + p.cfg.lead + " 天已经算进目标天数。";
}

function explain(p, plans) {
  const u = p.sku.unit;
  const lines = [
    "在店可售 " + n0(p.sellable) + " " + u + "（账面 " + n0(p.onHand) + " − 占用 " + n0(p.reserved) + "）",
    "在途 " + n0(p.transit) + " " + u + "，含在途可售 " + n1(p.dosAll) + " 天",
    "日均 " + n1(p.daily) + " " + u + "。近 7 天占 50%，14 天占 30%，28 天占 20%，异常日已剔除",
    "在店可售 " + n1(p.dos) + " 天",
    "目标天数 = 配送 " + p.cfg.lead + " 天 + 安全 " + p.cfg.safety + " 天 = " + p.targetDays + " 天",
    "目标量 " + n1(p.targetQty) + " " + u + "，缺口 " + n1(p.gap) + " " + u,
    "箱规 " + p.sku.case + "，取整后建议 " + n0(p.suggest) + " " + u
  ];
  if (p.source === "transfer") {
    lines.push("调出前，" + STORES[p.from].name + "有 " + n0(p.fromBefore) + " " + u + "，可售 " + n1(p.fromDosBefore) + " 天");
    lines.push("本条执行 " + n0(p.execQty) + " " + u + " 后，剩 " + n0(p.fromAfter) + " " + u + "，可售 " + n1(p.fromDosAfter) + " 天");
    lines.push("调出后至少保留 14 天用量，本条可调上限 " + n0(p.stepMax) + " " + u);
    if (p.dcOnHand < p.suggest) {
      lines.push("总仓现货 " + n0(p.dcOnHand) + " " + u + "，不够取整后的 " + n0(p.suggest) + " " + u + "，所以走调拨");
    } else {
      lines.push("总仓有 " + n0(p.dcOnHand) + " " + u + "。调出店可售超过 14 天，今天先调拨");
    }
    if (STORES[p.from].stale >= 21) {
      lines.push(STORES[p.from].name + "已 " + STORES[p.from].stale + " 天未盘点，出库前先复盘");
    }
  }
  if (p.source === "dc") {
    const siblings = plans.filter((x) => x.source === "dc" && x.sku.id === p.sku.id).sort((a, b) => a.dos - b.dos);
    const rank = siblings.findIndex((x) => x.id === p.id) + 1;
    lines.push("总仓现货 " + n0(p.dcOnHand) + " " + u + "，按在店可售从短到长分配，本店排第 " + rank);
    lines.push("分到本店时的可分配上限 " + n0(p.stepMax) + " " + u + "，执行 " + n0(p.execQty) + " " + u);
  }
  if (p.source === "supplier") {
    lines.push("总仓不备这个商品，向供应商直送");
  }
  if (p.source === "covered") {
    lines.push("在店加在途已经达到目标量，执行量为 0");
  }
  return lines;
}

function categoryMins() {
  return CATS.map((cat) => {
    let store = STORE_ORDER[0];
    let dos = MATRIX[store][cat];
    STORE_ORDER.forEach((id) => {
      if (MATRIX[id][cat] < dos) {
        dos = MATRIX[id][cat];
        store = id;
      }
    });
    return { cat, store, dos };
  }).sort((a, b) => a.dos - b.dos);
}

function overValue(minDos) {
  return OVER.reduce((sum, o) => {
    const dos = o.onHand / o.daily;
    if (dos >= minDos) return sum + o.onHand * SKUS[o.sku].price;
    return sum;
  }, 0);
}

function dcNotes(plans) {
  return plans.filter((p) => p.blocked).map((b) => {
    const winner = plans.find((p) => p.sku.id === b.sku.id && p.source === "dc" && p.execQty > 0);
    const got = winner
      ? STORES[winner.store].name + "分到 " + n0(winner.execQty) + " " + b.sku.unit
      : "没有门店分到货";
    return b.sku.name + "总仓现货 " + n0(b.dcOnHand) + " " + b.sku.unit + "，" + got + "。" + STORES[b.store].name + "可售 " + n1(b.dos) + " 天，今天分配为 0。";
  });
}

function cellDetail(store, cat, plans) {
  const lines = [];
  plans.filter((p) => p.store === store && p.sku.cat === cat).forEach((p) => {
    const transit = p.transit ? "，在途 " + n0(p.transit) + p.sku.unit + "，含在途 " + n1(p.dosAll) + " 天" : "";
    lines.push(p.sku.name + "：在店 " + n0(p.sellable) + p.sku.unit + transit + "，可售 " + n1(p.dos) + " 天，执行 " + n0(p.execQty) + p.sku.unit + "（" + sourceName(p) + "）");
  });
  const short = SHORT[store + "|" + cat];
  if (short) {
    lines.push(short.name + "：在店 " + n0(short.onHand) + "，日均 " + n1(short.daily) + "，可售 " + n1(short.onHand / short.daily) + " 天。" + short.note);
  }
  plans.filter((p) => p.source === "transfer" && p.from === store && p.sku.cat === cat).forEach((p) => {
    lines.push(p.sku.name + "：调出前 " + n0(p.fromBefore) + p.sku.unit + "，可售 " + n1(p.fromDosBefore) + " 天。调给" + STORES[p.store].name + " " + n0(p.execQty) + p.sku.unit + "后，剩 " + n1(p.fromDosAfter) + " 天。");
  });
  OVER.filter((o) => o.store === store && SKUS[o.sku].cat === cat).forEach((o) => {
    const sku = SKUS[o.sku];
    const dos = o.onHand / o.daily;
    const text = sku.name + "：在店 " + n0(o.onHand) + sku.unit + "，可售 " + n1(dos) + " 天，金额 " + money(o.onHand * sku.price) + "。" + (dos >= 60 ? "滞销。" : "刚过 21 天超储线。");
    if (!lines.some((l) => l.indexOf(sku.name + "：") === 0)) lines.push(text);
  });
  EXP.filter((a) => a.store === store && SKUS[a.sku].cat === cat).forEach((a) => {
    const sku = SKUS[a.sku];
    lines.push(sku.name + "：在店 " + n0(a.onHand) + sku.unit + "，其中 " + a.expiring + sku.unit + " 将在 " + a.daysLeft + " 天内到期。日均 " + n1(a.daily) + "，大约 " + n1(a.expiring / a.daily) + " 天能卖完。建议堆头，不要补货。");
  });
  if (!lines.length) {
    lines.push(SAMPLE[cat] + "：该品类在店最短可售 " + n1(MATRIX[store][cat]) + " 天。");
  }
  return lines;
}

function pageHome(plans) {
  const risks = plans.filter((p) => p.dos < 2).sort((a, b) => a.dos - b.dos);
  const riskStores = new Set(risks.map((p) => p.store));
  const executable = plans.filter((p) => p.execQty > 0 && p.status !== "hold");
  const transfers = executable.filter((p) => p.source === "transfer");
  const notes = dcNotes(plans);
  const bars = categoryMins().map((c) => {
    const h = heat(c.dos);
    const w = Math.max(4, Math.min(100, (c.dos / 14) * 100));
    return '<div class="bar-row"><span class="bar-name">' + esc(c.cat) + '</span><span class="track"><span class="fill ' + h + '" style="width:' + w + '%"></span></span><span class="bar-val">' + n1(c.dos) + " 天 · " + esc(STORES[c.store].name) + "</span></div>";
  }).join("");
  const riskRows = risks.map((p) => {
    const sm = statusMeta(p);
    return "<tr><td>" + esc(STORES[p.store].name) + '</td><td><button class="linkish" data-open="' + p.id + '">' + esc(p.sku.name) + "</button></td><td>" + pill(n1(p.dos) + " 天", heat(p.dos)) + "</td><td>" + esc(sourceName(p)) + "</td><td class=\"num\">" + n0(p.execQty) + " " + esc(p.sku.unit) + "</td><td>" + pill(sm[0], sm[1]) + "</td></tr>";
  }).join("");
  return ''
    + '<div class="stats">'
    + stat(riskStores.size + " 家", "可售不足 2 天的门店", true)
    + stat(String(executable.length), "今天可执行", false)
    + stat(String(transfers.length), "店间调拨", false)
    + stat(money(overValue(60)), "滞销库存（可售 ≥ 60 天）", false)
    + "</div>"
    + (notes.length ? '<div class="note">' + esc(notes.join("")) + "</div>" : "")
    + '<div class="cols"><div class="panel"><div class="pad headrow"><strong>不足 2 天</strong><span>' + risks.length + ' 条</span></div><table><thead><tr><th>门店</th><th>商品</th><th>在店可售</th><th>方式</th><th class="num">执行量</th><th>状态</th></tr></thead><tbody>' + riskRows + "</tbody></table></div>"
    + '<div class="panel"><div class="pad"><strong>今天的处理顺序</strong><ol class="rules"><li>在店可售不足 2 天的，先从富余店调拨。</li><li>调出后，对方至少留下 14 天用量。</li><li>还缺的部分用总仓现货，按可售天数从短到长分。</li><li>总仓不备的商品，开供应商直送，交期算进目标天数。</li><li>当天销量突然放大的，先确认原因，不改日均。</li></ol></div></div></div>'
    + '<div class="panel" style="margin-top:14px"><div class="pad headrow"><strong>各品类最短可售天数</strong><span>8 店里的最低值 · 不含在途</span></div><div class="pad">' + bars + "</div></div>";
}

function stat(value, label, hot) {
  return '<div class="stat' + (hot ? " hot" : "") + '"><b>' + esc(value) + "</b><span>" + esc(label) + "</span></div>";
}
function pill(text, tone) {
  return '<span class="pill ' + (tone || "") + '">' + esc(text) + "</span>";
}

function pageReplenish(plans) {
  const filters = [
    ["todo", "要处理"],
    ["transfer", "调拨"],
    ["dc", "总仓"],
    ["supplier", "直送"],
    ["covered", "不必补"]
  ];
  const chips = filters.map(([id, name]) => {
    const n = plans.filter((p) => id === "covered" ? p.source === "covered" : inFilter(p, id)).length;
    return '<button class="btn small' + (state.filter === id ? " on" : "") + '" data-filter="' + id + '">' + name + " " + n + "</button>";
  }).join("");
  const rows = plans.filter((p) => state.filter === "covered" ? p.source === "covered" : inFilter(p, state.filter));
  const body = rows.map((p) => {
    const sm = statusMeta(p);
    return '<tr class="' + (state.selected === p.id ? "sel" : "") + '"><td>' + esc(STORES[p.store].name) + '</td><td><button class="linkish" data-open="' + p.id + '">' + esc(p.sku.name) + "</button></td><td>" + pill(n1(p.dos) + " 天", heat(p.dos)) + '</td><td class="num">' + n0(p.suggest) + '</td><td class="num">' + n0(p.execQty) + " " + esc(p.sku.unit) + "</td><td>" + esc(sourceName(p)) + "</td><td>" + pill(sm[0], sm[1]) + "</td></tr>";
  }).join("");
  const current = plans.find((p) => p.id === state.selected);
  return '<div class="split"><div class="grow"><div class="filters">' + chips + '</div><div class="panel"><table><thead><tr><th>门店</th><th>商品</th><th>在店可售</th><th class="num">建议</th><th class="num">执行</th><th>方式</th><th>状态</th></tr></thead><tbody>' + body + "</tbody></table></div></div>" + (current ? drawer(current, plans) : "") + "</div>";
}

function drawer(p, plans) {
  const sm = statusMeta(p);
  const lines = explain(p, plans).map((l) => "<li>" + esc(l) + "</li>").join("");
  const canEdit = p.stepMax > 0;
  const actions = p.source === "covered"
    ? ""
    : '<div class="row-actions"><label>执行 <input class="qty" data-qty="' + p.id + '" type="number" min="0" max="' + p.stepMax + '" step="' + p.sku.case + '" value="' + shownQty(p) + '"' + (p.stepMax === 0 && p.status !== "hold" ? " disabled" : "") + "></label>"
      + '<button class="btn primary small" data-act="confirm" data-id="' + p.id + '"' + (canEdit ? "" : " disabled") + ">确认</button>"
      + '<button class="btn small" data-act="hold" data-id="' + p.id + '"' + (p.source === "covered" ? " disabled" : "") + ">暂缓</button>"
      + (state.decisions[p.id] ? '<button class="btn small" data-act="reset" data-id="' + p.id + '">恢复建议</button>' : "")
      + "</div>";
  return '<aside class="drawer"><div class="headrow" style="border:0;padding:0 0 8px"><h3 style="margin:0">' + esc(STORES[p.store].name) + "</h3>" + pill(sm[0], sm[1]) + "</div><p>" + esc(p.sku.name) + '</p><p class="verdict" style="margin-top:8px">' + esc(verdict(p)) + '</p><ul class="calc">' + lines + "</ul>" + actions + '<p class="muted" style="margin-top:10px">金额 ' + money(p.execQty * p.sku.price) + " · 箱规 " + p.sku.case + " " + esc(p.sku.unit) + "</p></aside>";
}

function pageTransfer(plans) {
  const rows = plans.filter((p) => p.source === "transfer");
  const body = rows.map((p) => {
    const sm = statusMeta(p);
    const stale = STORES[p.from].stale >= 21 ? pill(STORES[p.from].stale + " 天未盘点", "warn") : "已盘点";
    return "<tr><td>" + esc(p.sku.name) + "</td><td>" + esc(STORES[p.from].name) + "</td><td class=\"num\">" + n1(p.fromDosBefore) + " → " + n1(p.fromDosAfter) + " 天</td><td class=\"num\">" + n0(p.execQty) + " " + esc(p.sku.unit) + "</td><td>" + esc(STORES[p.store].name) + "</td><td>" + pill(n1(p.dos) + " 天", heat(p.dos)) + "</td><td>" + stale + "</td><td>" + pill(sm[0], sm[1]) + '</td><td><button class="btn small" data-open="' + p.id + '">计算</button></td></tr>';
  }).join("");
  return '<p class="sub" style="margin-bottom:10px">调出后至少保留 14 天用量，并按箱规取整。同一调出店按表中顺序扣减。老城店纸品调出后仍然滞销，清库存要另做促销，不在这条调拨里一次出清。</p><div class="panel"><table><thead><tr><th>商品</th><th>调出</th><th class="num">调出前 → 后</th><th class="num">数量</th><th>调入</th><th>调入可售</th><th>盘点</th><th>状态</th><th></th></tr></thead><tbody>' + body + "</tbody></table></div>";
}

function pageMatrix(plans) {
  const head = CATS.map((c) => '<th class="num">' + esc(c) + "</th>").join("");
  const body = STORE_ORDER.map((id) => {
    const cells = CATS.map((cat) => {
      const dos = MATRIX[id][cat];
      const key = id + "|" + cat;
      const on = state.cell === key ? " on" : "";
      return '<td class="' + heat(dos) + on + '"><button class="cell" data-cell="' + esc(key) + '">' + n1(dos) + "</button></td>";
    }).join("");
    return "<tr><td>" + esc(STORES[id].name) + "<div class=\"muted\">" + esc(STORES[id].region) + "</div></td>" + cells + "</tr>";
  }).join("");
  const parts = (state.cell || "dxc|饮料").split("|");
  const store = parts[0];
  const cat = parts[1];
  const lines = cellDetail(store, cat, plans).map((l) => "<li>" + esc(l) + "</li>").join("");

function storeSections(storeId, plans) {
  const sections = [];
  const outbound = plans.filter((p) => p.source === "transfer" && p.from === storeId);
  const inbound = plans.filter((p) => p.store === storeId && p.source === "transfer");
  const orders = plans.filter((p) => p.store === storeId && (p.source === "dc" || p.source === "supplier"));
  const covered = plans.filter((p) => p.store === storeId && p.source === "covered");
  if (outbound.length) {
    sections.push({
      title: "待确认调出",
      rows: outbound.map((p) => ({
        id: p.id,
        title: p.sku.name,
        tag: statusMeta(p)[0],
        tone: statusMeta(p)[1],
        text: "调给" + STORES[p.store].name + " " + n0(p.execQty) + p.sku.unit + "。调出前可售 " + n1(p.fromDosBefore) + " 天，调出后 " + n1(p.fromDosAfter) + " 天。",
        editable: true,
        p
      }))
    });
  }
  if (inbound.length) {
    sections.push({
      title: "今日调入",
      rows: inbound.map((p) => ({
        id: p.id,
        title: p.sku.name,
        tag: "从" + STORES[p.from].name,
        tone: "",
        text: "你店可售 " + n1(p.dos) + " 天。调入 " + n0(p.execQty) + p.sku.unit + "。" + (p.status === "confirmed" ? "总部状态：已确认。" : "确认本店收得下。"),
        editable: true,
        p
      }))
    });
  }
  if (orders.length) {
    sections.push({
      title: "总仓 / 直送",
      rows: orders.map((p) => ({
        id: p.id,
        title: p.sku.name,
        tag: p.blocked ? "总仓不足" : sourceName(p),
        tone: p.blocked ? "bad" : "warn",
        text: p.blocked
          ? "需求取整 " + n0(p.suggest) + p.sku.unit + "，总仓分完后本店是 0。先用现货顶 " + n1(p.dos) + " 天。"
          : "建议执行 " + n0(p.execQty) + p.sku.unit + "。在店可售 " + n1(p.dos) + " 天。",
        editable: !p.blocked,
        p
      }))
    });
  }
  if (covered.length) {
    sections.push({
      title: "今天不必补",
      rows: covered.map((p) => ({
        id: p.id,
        title: p.sku.name,
        tag: "在途已覆盖",
        tone: "ok",
        text: "在店 " + n0(p.sellable) + "，在途 " + n0(p.transit) + "，含在途可售 " + n1(p.dosAll) + " 天，已高于目标 " + n1(p.targetQty) + p.sku.unit + "。",
        editable: false,
        p
      }))
    });
  }
  const alerts = [];
  OVER.filter((o) => o.store === storeId).forEach((o) => {
    const sku = SKUS[o.sku];
    const dos = o.onHand / o.daily;
    if (outbound.some((p) => p.sku.id === o.sku)) return;
    alerts.push(sku.name + " 可售 " + n1(dos) + " 天，金额 " + money(o.onHand * sku.price) + "。" + (dos >= 60 ? "滞销，先清后进。" : "刚过超储线。"));
  });
  ANOM.filter((a) => a.store === storeId).forEach((a) => {
    const sku = SKUS[a.sku];
    alerts.push(sku.name + " 今日卖了 " + a.today + sku.unit + "，日均 " + n1(a.daily) + "。" + a.note);
  });
  EXP.filter((a) => a.store === storeId).forEach((a) => {
    const sku = SKUS[a.sku];
    alerts.push(sku.name + " 有 " + a.expiring + sku.unit + " 将在 " + a.daysLeft + " 天内到期。大约 " + n1(a.expiring / a.daily) + " 天能卖完，建议堆头，不要补货。");
  });
  if (STORES[storeId].stale >= 21) {
    alerts.push("本店已 " + STORES[storeId].stale + " 天没有盘点。调出数量以实盘为准。");
  }
  if (alerts.length) {
    sections.push({ title: "本店预警", rows: alerts.map((text) => ({ title: "", tag: "", text, editable: false })) });
  }
  return sections;
}

function render() {
  document.getElementById("app").innerHTML = layout(build());
}

function decide(id, status) {
  const plan = build().find((p) => p.id === id);
  if (!plan || plan.source === "covered") return;
  if (status === "confirmed" && plan.stepMax === 0) {
    state.toast = "当前没有可分配数量";
    return;
  }
  const input = document.querySelector('[data-qty="' + id + '"]');
  let qty = input ? Number(input.value) : plan.stored;
  if (!Number.isFinite(qty) || qty < 0) qty = plan.suggest;
  const caseSize = plan.sku.case;
  qty = Math.floor(qty / caseSize) * caseSize;
  if (status === "hold" || qty === 0) {
    state.decisions[id] = { status: "hold", qty: qty || plan.suggest };
    state.toast = "已暂缓。占用的总仓或可调数量已释放";
    return;
  }
  const max = plan.stepMax;
  let note = "";
  if (qty > max) {
    qty = max;
    note = "，已按可分配上限改为 " + n0(qty);
  }
  state.decisions[id] = { status: "confirmed", qty: qty };
  state.toast = "已确认，并写进配货草稿" + note;
}

document.getElementById("app").addEventListener("click", (e) => {
  if (e.target.classList && e.target.classList.contains("mask")) {
    state.modal = false;
    state.toast = "";
    render();
    return;
  }
  const el = e.target.closest("[data-act],[data-go],[data-open],[data-filter],[data-cell],[data-tab]");
  if (!el) return;
  state.toast = "";
  if (el.dataset.filter) state.filter = el.dataset.filter;
  if (el.dataset.cell) state.cell = el.dataset.cell;
  if (el.dataset.tab && el.dataset.go !== "alerts" && !el.dataset.go) state.alertTab = el.dataset.tab;
  if (el.dataset.go) {
    state.screen = el.dataset.go;
    if (el.dataset.tab) state.alertTab = el.dataset.tab;
    if (state.screen !== "replenish") state.selected = null;
  }
  if (el.dataset.open) {
    state.screen = "replenish";
    state.selected = el.dataset.open;
    state.filter = "todo";
  }
  if (el.dataset.act === "export") state.modal = true;
  if (el.dataset.act === "close-modal") state.modal = false;
  if (el.dataset.act === "close-drawer") state.selected = false;
  if (el.dataset.act === "confirm") decide(el.dataset.id, "confirmed");
  if (el.dataset.act === "hold") decide(el.dataset.id, "hold");
  if (el.dataset.act === "reset") {
    delete state.decisions[el.dataset.id];
    state.toast = "已恢复系统建议";
  }
  if (el.dataset.act === "save-config") {
    document.querySelectorAll("[data-cfg]").forEach((input) => {
      const pair = input.dataset.cfg.split("|");
      const v = Number(input.value);
      if (Number.isFinite(v) && v >= 0 && v <= 30) state.config[pair[0]][pair[1]] = v;
    });
    state.toast = "已按新的配送周期和安全天数重算今日建议";
  }
  render();
});

document.getElementById("app").addEventListener("change", (e) => {
  if (e.target.dataset.role === "manager-store") {
    state.managerStore = e.target.value;
    render();
  }
});

document.addEventListener("keydown", (e) => {
  if (e.key === "Escape" && state.modal) {
    state.modal = false;
    render();
  }
});

render();
</script>
</body>
</html>
